packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  # Not a dependency here: the docs deploy's wrangler-action runs `pnpm add wrangler@4`, and pnpm 12
  # refuses a package whose build script was not allowed (ERR_PNPM_IGNORED_BUILDS) — wrangler brings
  # workerd. Measured on a worktree of main: refused without this line, installed and running with it.
  workerd: true
overrides:
  esbuild: ">=0.28.1"
