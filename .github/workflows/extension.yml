# Packaging and publishing the editor extension.
#
# DISABLED ON PURPOSE: the only trigger is `workflow_dispatch`, so it cannot fire before somebody has
# created the publisher and the `VSCE_PAT` secret. See packages/css/vscode/PUBLISHING.md.
#
# It is separate from `release.yml` because the two answer different questions. The npm packages are
# released when their API changes; the extension is released when its grammars or diagnostics do.
# One workflow would publish an unchanged extension on every patch of anything.
name: Extension

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the marketplace, rather than only building the .vsix"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  extension:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The grammars the extension ships are the ones the package's tests read, so a broken grammar
      # fails here before anything is packaged. Through turbo, because `test` depends on `build` and
      # calling the script directly would skip it — the repo's own workflow check says so.
      - name: The grammar tests
        run: pnpm exec turbo run test --filter=@ramonda/css

      # From the folder, not through a filter: `packages/css/vscode` is deliberately NOT a workspace
      # package — it is installed by linking, and nothing in it is published to npm — so
      # `pnpm --filter ramonda-css-vscode …` matched no project at all and both of these steps
      # failed before they ran. Measured, on the day the publisher was being created.
      - name: Package
        working-directory: packages/css/vscode
        run: pnpm run package

      # Kept whether or not it is published, so a build can be installed by hand from a run.
      #
      # A GLOB, because the bundle carries its version: `ramonda-css-0.1.2.vsix`. The name used to be
      # fixed and this path was written out in full — which would have failed here, on a workflow
      # nothing runs automatically, long after the rename.
      - uses: actions/upload-artifact@v7
        with:
          name: ramonda-css-vsix
          path: packages/css/vscode/*.vsix
          if-no-files-found: error

      # `publish-marketplace`, and the name matters: `pnpm publish` is a BUILT-IN command, so
      # `pnpm --filter … publish` would have asked pnpm to publish this folder to npm rather than
      # running the script beside it.
      - name: Publish
        if: ${{ inputs.publish }}
        working-directory: packages/css/vscode
        run: pnpm run publish-marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
