name: Deploy docs

# Deploys apps/docs (the prerendered static site) to Cloudflare Pages.
#   - push to main  → production deployment
#   - PR to main    → a preview deployment with its own URL, posted back to the PR
#
# The docs build consumes the workspace packages from SOURCE via esbuild aliases,
# so no package needs building first — but it must run through TURBO, because
# `content` (which writes src/generated/) is a turbo task the build declares in
# `dependsOn`. The chain is content → esbuild → prerender → pagefind, and it
# writes apps/docs/dist.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write
  pull-requests: write # let wrangler-action post the preview URL on the PR

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    # Skip PRs from forks: repository secrets (the Cloudflare token) are not
    # available to them, so the deploy could only fail. Same-repo PRs and pushes
    # to main run normally.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # Through TURBO, not the package script directly. `content` (which writes
      # src/generated/) is a turbo task that `build` declares in `dependsOn`, so
      # calling the script on its own skips it and esbuild fails on three imports
      # that no longer resolve. That is not hypothetical — it is how this deploy
      # broke once already.
      - name: Build the docs site
        run: pnpm exec turbo run build --filter=@ramonda/docs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        # wrangler-action installs wrangler with `pnpm add wrangler`, which in a
        # workspace root pnpm refuses (ERR_PNPM_ADDING_TO_ROOT) unless told the root
        # is intended. Scope that allowance to this step only — it does not affect
        # local dev or the other jobs.
        env:
          npm_config_ignore_workspace_root_check: "true"
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Lets the action create a GitHub deployment and comment the preview URL.
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # `pages deploy` will not create a missing project non-interactively, so
          # ensure it exists first. On the first run this creates it (with main as
          # the production branch); on every later run the create fails with
          # "already exists", which `|| true` swallows. A real auth/permission
          # problem still surfaces on the deploy command below.
          preCommands: |
            wrangler pages project create ramonda --production-branch=main || true
          # `--branch` decides production vs preview: Cloudflare treats a deploy on
          # the project's production branch (main) as production, and any other
          # branch as a preview with its own *.pages.dev URL.
          command: >-
            pages deploy apps/docs/dist
            --project-name=ramonda
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-dirty=true
