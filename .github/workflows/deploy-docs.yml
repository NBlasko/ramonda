name: Deploy docs

# Deploys apps/docs (the prerendered static site) to Cloudflare Pages, from `main`
# only, plus a manual run when a deployment needs repeating.
#
# It used to deploy pull requests too, as previews. That went away with the
# dependency bots: a Dependabot pull request never receives repository secrets —
# by design, since its branch content is not the author's — so `CLOUDFLARE_API_TOKEN`
# arrived empty and every one of them ended in a red check at the deploy step while
# the build above it passed. A preview of a `@types/node` patch bump is worth
# nothing, and a check that fails for reasons no reviewer can act on is worth less
# than nothing.
#
# Nothing about the docs goes unverified as a result. `checks.yml` runs
# `turbo run build` with no filter, so `@ramonda/docs` builds on every pull request
# through its whole chain — content → esbuild → prerender → pagefind — and the
# repository's own `ramonda-check-bundle` parses every emitted file. What a preview
# added was a URL, not confidence.
#
# The build must run through TURBO, not the package script: `content` (which writes
# src/generated/) is a turbo task that `build` declares in `dependsOn`, and calling
# the script directly skips it. The docs consume the workspace packages from SOURCE
# via esbuild aliases, so no package needs building first.
on:
  push:
    branches: [main]
  # Re-deploy the current `main` without pushing a commit — for a deploy that failed
  # on something outside the repository, or a Cloudflare project that needs filling
  # again.
  workflow_dispatch:

concurrency:
  group: deploy-docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup

      # Through TURBO, not the package script directly. `content` (which writes
      # src/generated/) is a turbo task that `build` declares in `dependsOn`, so
      # calling the script on its own skips it and esbuild fails on three imports
      # that no longer resolve. That is not hypothetical — it is how this deploy
      # broke once already.
      - name: Build the docs site
        run: pnpm exec turbo run build --filter=@ramonda/docs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        # wrangler-action installs wrangler with `pnpm add wrangler`, which in a
        # workspace root pnpm refuses (ERR_PNPM_ADDING_TO_ROOT) unless told the root
        # is intended. Scope that allowance to this step only — it does not affect
        # local dev or the other jobs.
        env:
          npm_config_ignore_workspace_root_check: "true"
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Lets the action record a GitHub deployment, so the Environments tab shows
          # what is live and when it went out.
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # `pages deploy` will not create a missing project non-interactively, so
          # ensure it exists first. On the first run this creates it (with main as
          # the production branch); on every later run the create fails with
          # "already exists", which `|| true` swallows. A real auth/permission
          # problem still surfaces on the deploy command below.
          preCommands: |
            wrangler pages project create ramonda --production-branch=main || true
          # `--branch` decides production vs preview: Cloudflare treats a deploy on
          # the project's production branch as production. This workflow only ever
          # runs on `main`, so `github.ref_name` is that branch and every deploy from
          # here is a production one. (Keep it explicit rather than hard-coding
          # "main": renaming the default branch then needs one change, in the
          # Cloudflare project, not two.)
          command: >-
            pages deploy apps/docs/dist
            --project-name=ramonda
            --branch=${{ github.ref_name }}
            --commit-dirty=true
