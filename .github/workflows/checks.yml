name: Checks

# Reusable workflow: the single source of truth for "is this tree good?".
# Called by ci.yml on every PR and push, and by release.yml as the gate before
# anything is published — so a release can never ship code that would have failed
# CI. Split into parallel jobs for fast feedback and a clear signal of WHAT broke.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # oxlint over the whole monorepo in one pass (config: .oxlintrc.json). Hard
      # gate: the tree is clean today (0 errors).
      - name: Lint (oxlint)
        run: pnpm lint
      # Formatting is biome's job (formatter-only; oxlint does the linting). This
      # checks without writing — it fails if anything is not biome-formatted.
      - name: Format check (biome)
        run: pnpm format:check

  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # Covers every package with a `check-types` script: core, router, lens,
      # testing-library, docs.
      - run: pnpm exec turbo run check-types

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # No filters: every package that HAS a `test` script runs it, and turbo skips the ones
      # that do not. The two scratch playgrounds used to carry the `npm init` placeholder
      # (`echo "no test specified" && exit 1`), which failed forever and forced a filter here —
      # a script that can only fail hides whether the app works, so it is gone. Both are still
      # covered by the build job.
      - run: pnpm exec turbo run test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup
      # Builds every package AND the docs/playground apps, so the whole
      # prerender + pagefind pipeline is exercised on every PR, not just at deploy.
      - run: pnpm exec turbo run build
