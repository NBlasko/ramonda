name: Checks

# Reusable workflow: the single source of truth for "is this tree good?".
# Called by ci.yml, on every pull request and every push to main. Split into
# parallel jobs for fast feedback and a clear signal of WHAT broke.
#
# `release.yml` does NOT call this. It runs after a merge whose pull request this
# already gated, and re-running it there would be the same commit checked twice.
# The gap that leaves is named in .github/workflows/README.md, under "What CI does
# not gate" — the version pull request is the one tree nothing here sees.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # oxlint over the whole monorepo in one pass (config: .oxlintrc.json). Hard
      # gate: the tree is clean today (0 errors).
      - name: Lint (oxlint)
        run: pnpm lint
      # Formatting is biome's job (formatter-only; oxlint does the linting). This
      # checks without writing — it fails if anything is not biome-formatted.
      - name: Format check (biome)
        run: pnpm format:check
      # Lints the WORKFLOWS: a job that runs a package script turbo is meant to
      # orchestrate skips that task's `dependsOn`. That is not theoretical — the
      # docs deploy did exactly this and shipped nothing but three unresolved
      # imports, while every other check stayed green. Its own self-test runs
      # first, since a check nobody has seen fail proves nothing.
      - name: Check workflows
        run: SELFTEST=1 node scripts/check-workflows.mjs && node scripts/check-workflows.mjs

  typecheck:
    name: Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Covers every package with a `check-types` script: core, router, lens,
      # testing-library, docs.
      - run: pnpm exec turbo run check-types

  browser:
    name: Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Its own job rather than a step inside `test`, so the minutes it spends installing a browser
      # run beside the other checks instead of in front of them. Nothing here depends on it and it
      # depends on nothing: the app it drives is built in this job from this tree.
      #
      # The browser is keyed on the Playwright VERSION rather than on the lockfile: the binary it
      # wants changes when it changes, and a lockfile hash would throw the cache away on every
      # unrelated dependency bump.
      - name: Which browser build to look for
        id: playwright
        run: echo "version=$(pnpm --filter playground-core exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Restore the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-headless-shell-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The headless shell alone, not the full Chromium: measured at 267 MB against 656 MB, and this
      # suite runs headless, so the rest is a download nothing opens. A headed run would need
      # `playwright install chromium` — locally, where somebody is watching it.
      #
      # Unconditional rather than skipped on a cache hit. It takes about a second when the binary is
      # already there, and a cache that restored badly then repairs itself instead of failing the run.
      - name: Install Chromium
        run: pnpm --filter playground-core exec playwright install chromium-headless-shell

      # Apt packages, which are the runner's and not ours to cache.
      - name: Its system libraries
        run: pnpm --filter playground-core exec playwright install-deps chromium-headless-shell

      - name: Build the playground
        run: pnpm exec turbo run build --filter=playground-core

      # The handful of claims jsdom cannot settle: a caret the platform moves when a value is
      # assigned, and focus a node loses when it is picked up and put down. The jsdom suites in the
      # `test` job cover what the DOM HOLDS; these cover what a person does to it.
      #
      # Each was measured in jsdom first, agreed with, and then needed somebody at a keyboard before
      # it could be believed — and one of them behaved the opposite way in a browser for a reason
      # jsdom could not have shown.
      - name: Test in a browser
        run: pnpm --filter playground-core test:browser

      # A trace and a screenshot per failure. This suite exists for differences that appear only in
      # a browser, so a red run here is the one place where re-reading the source is least likely to
      # explain it.
      - name: Keep what the failure left behind
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure
          path: |
            apps/playground-core/test-results/
            apps/playground-core/playwright-report/
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # One task, instrumented. `test` IS the coverage run: each package's test script
      # carries `--coverage`, so vitest still exits non-zero on a failing test and this
      # stays the gate — it just also writes the numbers.
      #
      # It was briefly two jobs, `test` and `coverage`, which ran the whole suite twice
      # on every pull request to produce one report. Folding the flag into `test` instead
      # of adding a second task name is deliberate: three packages have tests that cannot
      # be instrumented (create-ramonda tests the built bundle, playground-ssr's is a
      # smoke test that boots a server), and under a separate `coverage` task they were
      # silently NOT RUN — 21 test tasks against 18. A second name is a name that can be
      # forgotten; there is now only one.
      #
      # Coverage is still not a THRESHOLD gate: nothing fails on a percentage. A failing
      # test fails; a lower number is reported and left to a human.
      #
      # No filters — every package that has a `test` script runs it, and turbo skips the
      # ones that do not.
      - name: Test with coverage
        run: pnpm exec turbo run test

      # Six packages each write paths relative to themselves, so six `src/index.ts`
      # records would collide into one file in the report. This rewrites them to be
      # repository-relative and unions the development and production runs, whose
      # coverage genuinely differs — `__DEV__` is baked in per process. Its self-test
      # runs first, on two hand-checked reports.
      - name: Merge into one report
        run: SELFTEST=1 node scripts/merge-lcov.mjs && node scripts/merge-lcov.mjs

      - name: Upload to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          file: coverage/lcov.info
          # No dedicated token: on a public repository the built-in GITHUB_TOKEN is
          # enough, and the repository appears on coveralls.io by itself at the first
          # successful upload.
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # A fork's pull request gets a read-only token, so the upload would 403 and
          # fail a check the contributor cannot fix. The numbers are still produced
          # and printed by the steps above.
          allow-empty: true
        # Reporting must never fail the gate: the tests above already passed by the
        # time this runs, and a Coveralls outage is not a fact about this code.
        continue-on-error: true

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Builds every package AND the docs/playground apps, so the whole
      # prerender + pagefind pipeline is exercised on every PR, not just at deploy.
      - run: pnpm exec turbo run build

      # In this job, and after the build, because the checker derives the framework's
      # own names from `packages/*/dist/index.d.ts`. Measured with `packages/core/dist`
      # moved aside: the globals come out empty and every example fails on `Component`,
      # which is exactly what a fresh checkout gives — so running it earlier, or in a
      # job of its own, would report the missing build rather than the examples.
      - name: Type-check the documentation examples
        run: node scripts/check-examples.mjs

      # Here for the same reason, and it needs the build even more directly: it asks a bundler what
      # survives importing each package's EMITTED entry. `@ramonda/devtools` once declared
      # `"sideEffects": false` while registering a custom element, and a bundler deleted the whole
      # package — 0 bytes — which nothing noticed, because nothing bundles it that way in development.
      #
      # Both self-tests first, each planting a fault the check must report: they exit 0 only when it
      # does, so a check that has gone to sleep fails here rather than passing quietly.
      - name: Check every package's sideEffects declaration
        run: |
          SELFTEST=table node scripts/check-side-effects.mjs
          SELFTEST=honoured node scripts/check-side-effects.mjs
          node scripts/check-side-effects.mjs

      # Next to it because it asks the opposite question about the same artefacts: that one asks a
      # BUNDLER what survives importing each entry, and a bundler never evaluates the module. This
      # one EXECUTES the import, in a Node process with no DOM.
      #
      # It exists because `debug/logger.ts` called `window.addEventListener` at module load inside
      # `if (__DEV__)`, and the development build is the `default` export condition — so
      # `import "@ramonda/core"` in a bare Node process threw before the caller's first line. Our
      # own SSR installs a DOM shim first and the suites run under jsdom, so nothing here could see
      # it.
      #
      # Both self-tests first, each planting a fault the check must report.
      - name: Import every package with no DOM
        run: |
          SELFTEST=import node scripts/check-bare-import.mjs
          SELFTEST=browser node scripts/check-bare-import.mjs
          SELFTEST=reason node scripts/check-bare-import.mjs
          SELFTEST=unbuilt node scripts/check-bare-import.mjs
          node scripts/check-bare-import.mjs

      # No build needed — it reads the source. Here so it runs beside the other two source-shape
      # checks rather than in its own job for four seconds of work.
      #
      # It exists because the SWEEP was done and missed most of them: the sites with an explicit
      # `??` or `||` fallback were fixed by grepping for those operators, and the twenty-nine with
      # no fallback at all matched neither. A grep for the operators cannot find a site that has
      # none; a grep for the READ can.
      - name: Refuse a bare constructor.name in a message
        run: |
          SELFTEST=bare node scripts/check-nameless-class.mjs
          SELFTEST=stale node scripts/check-nameless-class.mjs
          node scripts/check-nameless-class.mjs

          # Rides along here rather than in a step of its own: it reads nineteen files and needs no
          # build. It exists because a manifest rewritten by a serializer that escapes non-ASCII put
          # `"author": "Nikola Blagojevi\u0107"` on npm — twice by me in one branch, and twice more
          # that had been there long enough that nobody remembered.
          SELFTEST=escape node scripts/check-manifest-text.mjs
          node scripts/check-manifest-text.mjs

      # In this job because it packs the built packages and installs them into a generated
      # project — the tarballs a publish would push, not what npm already has.
      #
      # It exists because nothing else here runs a template. Every fault it lists in its own
      # header reached a released package: a project that could not build, one that died at
      # prerender, one that shipped pages with no title, and one whose production install would
      # not start. The gate could not see any of them — it runs `ramonda-check` over `apps/docs`
      # only, and the scaffolder's tests read templates as TEXT.
      #
      # Both self-tests first, each planting a fault the check must report, so a check that has
      # gone quiet fails here rather than passing.
      - name: Scaffold a project and build it
        run: |
          SELFTEST=head node scripts/check-scaffold.mjs ssr
          SELFTEST=app node scripts/check-scaffold.mjs ssr
          node scripts/check-scaffold.mjs ssr
          node scripts/check-scaffold.mjs spa
