name: Release

# Changesets-driven release. The "a PR drives the release" flow:
#
#   1. A PR that changes a package includes a changeset (`pnpm changeset`).
#   2. On merge to main, this workflow sees pending changesets and opens/updates a
#      "Version Packages" PR that bumps versions and writes CHANGELOGs.
#   3. Merging THAT PR leaves no pending changesets, so this workflow instead runs
#      the `release` script — which builds and `changeset publish`es to npm.
#
# So every push to main runs one job; the changesets/action decides which half of
# the flow it is. CI (ci.yml) has already gated the PR, so this does not re-run it.
#
# The changesets flow is live: a push to main with pending changesets opens a
# "Version Packages" PR (bumping versions + writing changelogs); merging that PR
# publishes. workflow_dispatch is kept so a release can also be triggered by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a release mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # commit the version bump / create tags
  pull-requests: write # open the Version Packages PR
  id-token: write # npm provenance

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    # Optional: an "npm" environment can require a manual approval before a
    # publish and scope NPM_TOKEN to it.
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          # Changesets needs full history to build changelogs and tags.
          fetch-depth: 0
      - uses: ./.github/actions/setup

      # Writes the auth .npmrc that `changeset publish` reads. The version comes
      # from `.nvmrc`, same as the setup action above — two pins would drift, and
      # this is the step that publishes.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Create Version PR or publish
        uses: changesets/action@v2
        with:
          # When changesets are pending: bump versions + changelogs into a PR.
          version: pnpm changeset version
          # When none are pending (the version PR was merged): build and publish.
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Both names on purpose: changesets/action looks for NPM_TOKEN (without
          # it, it falls back to OIDC trusted publishing, which is scoped to the
          # @ramonda org and CANNOT create the unscoped `create-ramonda`);
          # setup-node's .npmrc reads NODE_AUTH_TOKEN. The secret must be a token
          # that can create new packages — a classic Automation token (account-wide)
          # or a granular token with "All packages: Read and write". A token scoped
          # to only @ramonda will still 403 on create-ramonda.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
