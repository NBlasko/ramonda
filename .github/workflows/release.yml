name: Release

# Changesets-driven release. The "a PR drives the release" flow:
#
#   1. A PR that changes a package includes a changeset (`pnpm changeset`).
#   2. On merge to main, this workflow sees pending changesets and opens/updates a
#      "Version Packages" PR that bumps versions and writes CHANGELOGs.
#   3. Merging THAT PR leaves no pending changesets, so this workflow instead runs
#      the `release` script — which builds and `changeset publish`es to npm.
#
# So every push to main runs one job; the changesets/action decides which half of
# the flow it is. CI (ci.yml) has already gated the PR, so this does not re-run it.
#
# The changesets flow is live: a push to main with pending changesets opens a
# "Version Packages" PR (bumping versions + writing changelogs); merging that PR
# publishes. workflow_dispatch is kept so a release can also be triggered by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a release mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # commit the version bump / create tags
  pull-requests: write # open the Version Packages PR
  id-token: write # npm provenance

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    # An "npm" environment, which can require a manual approval before a publish.
    # It is also part of the publishing IDENTITY now: npm's trusted publisher config
    # names this environment, so renaming it here means renaming it there.
    environment: npm
    steps:
      - uses: actions/checkout@v7
        with:
          # Changesets needs full history to build changelogs and tags.
          fetch-depth: 0
      - uses: ./.github/actions/setup

      # Points npm at the public registry. The version comes from `.nvmrc`, same as
      # the setup action above — two pins would drift, and this is the step that
      # publishes. Node 24 carries npm 11.12, well past the 11.5.1 that OIDC needs.
      #
      # No `NODE_AUTH_TOKEN` is written into the .npmrc any more: publishing
      # authenticates with the workflow's own OIDC identity instead. See below.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: Create Version PR or publish
        uses: changesets/action@v1
        with:
          # When changesets are pending: bump versions + changelogs into a PR.
          version: pnpm changeset version
          # When none are pending (the version PR was merged): build and publish.
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No npm token, on purpose.
          #
          # Publishing authenticates with this workflow's OIDC identity — npm's
          # trusted publishing. `id-token: write` above is what mints it, and each
          # package names this repository and this workflow file as its publisher on
          # npmjs.com. A token, if one were passed, would be used INSTEAD, so it has
          # to be absent rather than merely unused.
          #
          # What that buys, and it is the whole reason for the change: a token
          # expires, and a release then fails with `E404 Not Found - PUT` on every
          # package at once — npm's way of saying "not authorised" without admitting
          # whether the package exists. That happened on 2026-08-31 with 74
          # changesets already versioned, and it had happened before. An identity
          # minted per run cannot expire.
          #
          # A NEW package cannot be published this way: its trusted publisher is
          # configured on a package page, which does not exist yet. Publish the first
          # version of one with a granular token, then configure it.
          #
          # Provenance stays asked for explicitly. Trusted publishing is understood to
          # imply it, and this costs nothing either way — but a signature that turns
          # out not to be automatic is not a thing to discover from its absence.
          NPM_CONFIG_PROVENANCE: "true"
