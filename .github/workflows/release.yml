name: Release

# Changesets-driven release. The "a PR drives the release" flow:
#
#   1. A PR that changes a package includes a changeset (`pnpm changeset`).
#   2. On merge to main, this workflow sees pending changesets and opens/updates a
#      "Version Packages" PR that bumps versions and writes CHANGELOGs.
#   3. Merging THAT PR leaves no pending changesets, so this workflow instead runs
#      the `release` script — which builds and `changeset publish`es to npm.
#
# So every push to main runs one job; the changesets/action decides which half of
# the flow it is. CI (ci.yml) has already gated the PR, so this does not re-run it.
#
# TEMPORARILY manual-only (`workflow_dispatch`) until npm is set up (the `@ramonda`
# org + 2FA). This guarantees a push can never publish before you are ready. To
# switch the changesets flow on, restore the `push:` trigger below:
#
#   on:
#     push:
#       branches: [main]
on:
  workflow_dispatch:

# Never cancel a release mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # commit the version bump / create tags
  pull-requests: write # open the Version Packages PR
  id-token: write # npm provenance

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    # Optional: an "npm" environment can require a manual approval before a
    # publish and scope NPM_TOKEN to it.
    environment: npm
    steps:
      - uses: actions/checkout@v4
        with:
          # Changesets needs full history to build changelogs and tags.
          fetch-depth: 0
      - uses: ./.github/actions/setup

      # Writes the auth .npmrc that `changeset publish` reads.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Create Version PR or publish
        uses: changesets/action@v1
        with:
          # When changesets are pending: bump versions + changelogs into a PR.
          version: pnpm changeset version
          # When none are pending (the version PR was merged): build and publish.
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
