<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ramonda SSR</title>
    <!-- Where a page's <Head> lands: its <meta> and <link>, and the title above is rewritten to
         whatever the page resolved. Nothing to do unless you remove it. -->
    <!--head-->
    <style>
      :root {
        --bg: #fbf8ff; --fg: #241a2e; --muted: #6b6376; --accent: #7a4fbf;
        --card: #ffffff; --line: #ece3f5;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14101a; --fg: #ece6f3; --muted: #a79fb3; --accent: #b18ae6;
          --card: #1e1826; --line: #2e2739;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); }
      .card { max-width: 30rem; margin: 2rem; padding: 2.5rem; text-align: center; background: var(--card); border: 1px solid var(--line); border-radius: 1rem; }
      .mark { display: block; width: 64px; height: 64px; margin: 0 auto 1rem; color: var(--accent); animation: spin 9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { .mark { animation: none; } }
      h1 { margin: 0 0 0.5rem; font-size: 2.25rem; letter-spacing: -0.02em; }
      .tagline { margin: 0 0 1.75rem; color: var(--muted); line-height: 1.6; }
      button { font: inherit; font-weight: 600; color: #fff; background: var(--accent); border: none; border-radius: 0.6rem; padding: 0.7rem 1.4rem; cursor: pointer; }
      button:hover { filter: brightness(1.08); }
      button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
      .hint { margin: 1.75rem 0 1rem; color: var(--muted); font-size: 0.9rem; }
      .docs { display: inline-block; margin-top: 1.5rem; color: var(--accent); font-weight: 600; text-decoration: none; }
      .docs:hover { text-decoration: underline; }
      body:has(.app) { display: block; }
      .app { max-width: 42rem; margin: 2rem auto; padding: 0 1.5rem; }
      .nav { display: flex; gap: 1rem; justify-content: center; margin-bottom: 1.5rem; }
      .nav a { color: var(--accent); font-weight: 600; text-decoration: none; }
      .nav a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div id="app"><!--ssr--></div>

    <!-- Named portal targets, AFTER the app root — which is the point of aiming at one: a subtree
         goes here to escape a stacking context or an `overflow: hidden` inside the app.

         Nothing uses it yet. It is here because the alternative is a build that FAILS the day you
         add your first `<Portal target={portalTarget("modals")}>`, and the fix would be one line
         in a file you had no reason to open. -->
    <!--portals-->
    <!-- Dev (Vite) serves this source directly with HMR; the production build
         rewrites it to the bundled /assets/client.js (see server.mjs). -->
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
